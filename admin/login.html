<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | GO CARE DRUG</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="icon" href="/assets/logo.jpg">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-brand">
      <img src="/assets/logo.jpg" alt="GO CARE DRUG logo">
      <div><strong>GO CARE DRUG</strong><small>ADMIN&nbsp;PANEL</small></div>
    </div>
    <h1>Welcome back</h1>
    <p>Sign in to manage your website content.</p>
    <div class="form-grid" style="grid-template-columns:1fr">
      <label class="f">Email / Username<input class="in" name="email" type="text" required autocomplete="username" placeholder="admin@gocaredrug.in"></label>
      <label class="f">Password
        <span class="pw-wrap"><input class="in" name="password" id="pwInput" type="password" required autocomplete="current-password" placeholder="••••••••"><button type="button" class="pw-eye" id="pwEye" aria-label="Show password">👁</button></span>
      </label>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:14px">
      <label style="display:flex;align-items:center;gap:7px;font-weight:600"><input type="checkbox" name="remember" checked> Remember me</label>
      <span style="flex:1"></span>
      <a href="#" id="forgotLink" style="font-weight:700">Forgot password?</a>
    </div>
    <p id="loginErr" style="color:#c0392b;font-weight:700;display:none;margin:0 0 12px"></p>
    <button class="btn btn-p" style="width:100%;justify-content:center" type="submit" id="loginBtn">Login →</button>
  </form>
</div>
<div id="toasts"></div>
<div class="modal-wrap" id="modalWrap"><div class="modal" id="modalBox"></div></div>
<script>
const $=s=>document.querySelector(s);
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3800);}
function modal(html){$('#modalBox').innerHTML=html;$('#modalWrap').classList.add('show');}
function closeModal(){$('#modalWrap').classList.remove('show');}
$('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal();});
$('#pwEye').onclick=()=>{const i=$('#pwInput');i.type=i.type==='password'?'text':'password';};
$('#forgotLink').onclick=e=>{e.preventDefault();modal(`<h3>Forgot password?</h3><p style="color:#5f7089">Enter your admin email. If it exists, reset instructions will be sent.</p><label class="f">Admin email<input class="in" id="fgEmail" type="email" placeholder="admin@gocaredrug.in"></label><div class="m-actions"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" id="fgGo">Send reset link</button></div>`);
$('#fgGo').onclick=async()=>{const r=await fetch('/api/auth/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#fgEmail').value})});const d=await r.json();closeModal();toast(d.message||'Done');};};
$('#loginForm').onsubmit=async e=>{e.preventDefault();const err=$('#loginErr');err.style.display='none';const b=$('#loginBtn');b.disabled=true;b.textContent='Signing in…';
try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.target.email.value,password:e.target.password.value,remember:e.target.remember.checked})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');location.href='/admin/';}
catch(ex){err.textContent=ex.message;err.style.display='block';}b.disabled=false;b.textContent='Login →';};
fetch('/api/auth/status').then(r=>r.json()).then(d=>{if(d.loggedIn)location.href='/admin/';}).catch(()=>{});
</script>
</body>
</html>
